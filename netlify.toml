# Netlify configuration

[build]
  # Base directory - where the frontend code lives
  base = "frontend"
  
  # Build command
  command = "npm run build"
  
  # Publish directory (relative to base)
  publish = "build"

# Without this, `netlify dev` can't detect a dev server to proxy to and falls back to
# serving the stale prebuilt frontend/build folder instead of live source (CRA on
# targetPort), so local changes never show up under `netlify dev`.
[dev]
  # Explicit --prefix: [dev].command runs from the repo root regardless of [build].base,
  # so a bare "npm start" fails with "Missing script" (root package.json has no "start").
  command = "npm --prefix frontend start"
  targetPort = 3000
  port = 8888
  publish = "build"
  autoLaunch = false

[functions]
  # Relative to base ("frontend/"), so resolves to frontend/netlify/functions
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Calibration reminder job — runs once daily. Production sending stays OFF
# until CALIBRATION_REMINDERS_ENABLED=true is set in Netlify env vars (not
# set yet). Until then every run is a safe dry-run — see the function file.
# CALIBRATION_FALLBACK_PERSONNEL_IDS (comma-separated personnel ids, e.g.
# "7,72,79") must also be set in Netlify env vars before enabling — it's the
# calibration-responsible fallback group for unassigned/in-storage
# equipment. Not set yet either.
# Per-function config must nest under [functions] as [functions."name"] —
# a sibling [[functions]] array-of-tables redefines the already-declared
# [functions] table and fails TOML parsing.
[functions."calibration-reminders-cron"]
  schedule = "0 6 * * *"

# Prevent index.html from being cached so users always get the latest build
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Handle React Router - redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
