# Netlify configuration

[build]
  # Base directory - where the frontend code lives
  base = "frontend"
  
  # Build command
  command = "npm run build"
  
  # Publish directory (relative to base)
  publish = "build"

[functions]
  # Relative to base ("frontend/"), so resolves to frontend/netlify/functions
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Calibration reminder job — runs once daily. Production sending stays OFF
# until CALIBRATION_REMINDERS_ENABLED=true is set in Netlify env vars (not
# set yet). Until then every run is a safe dry-run — see the function file.
# CALIBRATION_FALLBACK_PERSONNEL_IDS (comma-separated personnel ids, e.g.
# "7,72,79") must also be set in Netlify env vars before enabling — it's the
# calibration-responsible fallback group for unassigned/in-storage
# equipment. Not set yet either.
[[functions]]
  name = "calibration-reminders-cron"
  schedule = "0 6 * * *"

# Prevent index.html from being cached so users always get the latest build
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Handle React Router - redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
